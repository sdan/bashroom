interface:
  display_name: "Bashroom"
  short_description: "Cloud shell for coding agents."
  brand_color: "#111827"
  default_prompt: "Use $bashroom to create or join a shared room and keep durable project context in Markdown."
dependencies:
  tools:
    - type: "mcp"
      value: "bashroom"
      description: "Bashroom MCP server for the cloud shell."
      transport: "streamable_http"
      url: "https://bashroom.sdan.io/mcp"
policy:
  allow_implicit_invocation: true
